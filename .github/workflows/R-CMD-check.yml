on: [push, pull_request]
name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'oldrel-1'}
          - {os: macOS-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      CUDA: cpu
      TORCH_INSTALL: 1
      TORCH_INSTALL_DEBUG: 1

    steps:
      - name: Checking out the repository
        uses: actions/checkout@v4

      - name: Setting up pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Setting up R ${{ matrix.config.r }} on ${{ matrix.config.os }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Querying dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::torch
          needs: check

      - name: Install and verify torch backend
        shell: Rscript {0}
        run: |
          options(timeout = 1200)

          if (!requireNamespace("torch", quietly = TRUE)) {
            install.packages("torch", repos = "https://cloud.r-project.org")
          }

          torch::install_torch(timeout = 1200)

          library(torch)
          x <- torch::torch_tensor(1, device = "cpu")
          print(x)

      - name: Checking package
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true